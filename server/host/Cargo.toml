[package]
name = "rocx-server-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "The server platform's host: Roc compiled to native code, answering HTTP with tokio and hyper"

[lib]
# Roc links the app against this (server/platform/targets/<target>/libhost.a).
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
corosensei = { version = "0.3", default-features = false, features = ["unwind"] }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
libc = "0.2"
ring = "0.17"
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
# Turso (D-046): its engine alone, the SQLite flavor of SQL in Rust; no global allocator, no FTS.
turso_core = { version = "0.8.4", default-features = false, features = ["fs", "json", "time", "series", "uuid", "percentile", "pure-rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = "1"
webpki-roots = "1"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

# The host links no CoreFoundation (Roc links an app against the C library alone): chrono's time zone
# lookup, which turso_core's `localtime` reaches, reads /etc/localtime instead (patches/, D-046).
[patch.crates-io]
iana-time-zone = { path = "patches/iana-time-zone" }
