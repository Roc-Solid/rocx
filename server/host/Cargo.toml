[package]
name = "rocx-server-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "The server platform's host: Roc compiled to native code, answering HTTP with tokio and hyper"

[lib]
# Roc links the app against this (server/platform/targets/<target>/libhost.a).
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
corosensei = { version = "0.3", default-features = false, features = ["unwind"] }
deadpool-postgres = { version = "0.14", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
# enhanced:src's copies (D-125): JPEG, PNG and WebP read, resized, and written as WebP (libwebp's
# lossy encoder, built from its C source as SQLite is).
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "6", optional = true, features = ["image"] }
webp = { version = "0.3.1", optional = true, default-features = false }
libc = "0.2"
md-5 = "0.11.0"
ring = "0.17"
# column_metadata: where a result column comes from, and whether it is `not null` (D-058's check).
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype", "column_metadata"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
# Turso (D-046): its engine alone, the SQLite flavor of SQL in Rust; no global allocator, no FTS.
turso_core = { version = "0.8.4", optional = true, default-features = false, features = ["fs", "json", "time", "series", "uuid", "percentile", "pure-rust-crypto"] }
# Its statements' result columns, as turso_core plans them: where each comes from (D-058's check).
turso_parser = { version = "0.8.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "signal", "io-util"] }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.13", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", optional = true }
webpki-roots = "1"

# The database engines an app may name besides SQLite, which every host has: `rocx build --release`
# and `--image` build the host with the one the app's program names alone (rocx dev's has both).
# `images` is enhanced:src's (D-125): a release has it when the app's markup writes one.
[features]
default = ["postgres", "turso", "images"]
images = ["dep:image", "dep:fast_image_resize", "dep:webp"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:uuid"]
turso = ["dep:turso_core", "dep:turso_parser"]

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

# The host links no CoreFoundation (Roc links an app against the C library alone): chrono's time zone
# lookup, which turso_core's `localtime` reaches, reads /etc/localtime instead (patches/, D-046).
[patch.crates-io]
iana-time-zone = { path = "patches/iana-time-zone" }
