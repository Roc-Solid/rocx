[package]
name = "rocx-android"
version = "0.1.0"
edition = "2024"
publish = false
description = "The native host's Android half: JNI for the Kotlin applier, the main looper's wakeups, logcat"

[lib]
# native/android/build.sh links it with the app's Roc (an archive) into the app's libapp.so.
# As an rlib, it is native/android-dev's too: the dev client's libhost.so.
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[features]
# The dev client's: the app's Roc loaded at run time from a library rocx dev serves (`Rocx.reload`).
dev = ["rocx-native-core/dynamic"]

[dependencies]
rocx-native-core = { path = "../core" }
jni = { version = "0.21", default-features = false }
libc = "0.2"
