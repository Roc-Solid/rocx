[package]
name = "rocx-native-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The native host's engine: web/platform's hosted functions, the reactive runtime, and the native views as op batches"

[lib]
path = "src/lib.rs"

[features]
# The app's Roc in a library of its own, loaded at run time (`roc::set_entries`): the dev client's
# (`rocx dev --android`). Without it, the app is linked in (`roc_mount`, `roc_run`).
dynamic = []

[dependencies]
serde_json = "1"
# Roc's memory, shared with the browser's host (web/host): each allocation numbered by the call into
# Roc that made it, so what a call that ends early held is freed; and, in a browser, Zig's
# allocator for wasm.
rocx-memory = { path = "../../web/memory" }

[build-dependencies]
cc = "1"
