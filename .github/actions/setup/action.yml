# The toolchain for a CI job, on Linux (arm64, GitHub's ubuntu-24.04-arm): Node, just, Rust with
# the musl target the hosts are built for and wasm32 (the browser's host), `just setup` (Zig and the pinned nightly, cached; the Roc
# fork's compiler, which `just setup` downloads prebuilt from this repository's release of it;
# bin/rocx), the Rust hosts' dependencies (cached), and, when a job asks for them, Chromium and
# Firefox for the browser tests. A job's Postgres is a service of its own (ci.yml).
name: Toolchain
description: Node, just, Rust, the pinned toolchain (just setup), and browsers when asked for
inputs:
  browsers:
    description: Chromium's headless shell and Firefox, where web/test/browser.mjs finds them
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: just
      shell: bash
      run: |
        curl -fsSL https://just.systems/install.sh | bash -s -- --tag 1.59.0 --to "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Rust for the hosts (server/host, cli/host), built for musl: what Roc links on Linux; and for
    # wasm32, the browser's host (web/host).
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl, wasm32-unknown-unknown

    # Zig, the nightly and the glue spec, by the versions the Justfile pins (the fork's compiler is
    # downloaded each time: as quick as a cache, from the same place).
    - name: Pins
      id: pins
      shell: bash
      run: echo "key=$(grep -E '^(roc_nightly|roc_commit|zig_version) :=' Justfile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          .tools/zig
          .tools/roc
          .tools/glue
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.key }}

    # The hosts' crates (server/host, cli/host, web/host): every job shares one cache, saved by
    # master's runs.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          server/host -> target
          cli/host -> target
          web/host -> target
        shared-key: hosts
        save-if: ${{ github.ref == 'refs/heads/master' }}

    - name: Browsers
      if: inputs.browsers == 'true'
      shell: bash
      run: npx -y playwright@1.65.1 install --with-deps --only-shell chromium firefox

    - name: just setup
      shell: bash
      run: just setup
