# The checks a change lands with (README, "Working on this repository"), on GitHub's Linux runners on arm64
# (ubuntu-24.04-arm), with the Roc fork's compiler prebuilt for them (`just setup` downloads it).
# Five jobs, side by side: `just check` (then `just check-times`: how long checking takes, against
# the last green master run); `just site`; `just test` as two (`test-rocx` and `test-web`, with
# Chromium and Firefox; `test-server`, with a Postgres too); and `just examples`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A pull request's newer push stops its older run; master's runs all finish. Pull requests are
# grouped by number: a push to one just merged reports master's ref, and it took the place of
# master's own run waiting for a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The runners are slower than the machines the tests' time limits are measured on (a VM, its
  # Roc caches cold): the tests that measure time (site/test's dev rebuild, web/test/navigation's
  # waits and hover rest, web/test/platform's channel reconnects, server/test's 2,000 waits) allow
  # that much more.
  ROCX_TIME_SCALE: "3"
  # A step still running after this many minutes says what it is running: each process, its state
  # and what it waits in (a hang, seen at once in the log instead of a job's limit with nothing).
  ROCX_HANG_MINUTES: "20"

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the last green master run's check times
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      # How long checking each example and the site takes, in the job's summary, against the last
      # green master run's (its artifact, which carries the master runs before it): a warning, not a
      # failure, when one got slower.
      - name: just check-times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow ci.yml --branch master --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ]; then gh run download "$last" --name check-times --dir "$RUNNER_TEMP/baseline" || true; fi
          just check-times --baseline "$RUNNER_TEMP/baseline/check-times.json" --out check-times.json
      - uses: actions/upload-artifact@v7
        with:
          name: check-times
          path: check-times.json
          retention-days: 90

  site:
    name: just site
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just site

  # `just test` in two jobs side by side: its first two parts (the transpiler, the expects, the web
  # platform and the site in browsers), each a step that runs even when the one before failed, and
  # its third (the server platform and the packages' apps, on a Postgres).
  test:
    name: just test-rocx, test-web
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: .github/watch.sh just test-rocx
      - if: ${{ !cancelled() }}
        run: .github/watch.sh just test-web

  test-server:
    name: just test-server
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # As `just db`'s: Postgres 18, user and password rocx, which it asks for (SCRAM), as the tests
    # expect (one signs in with a wrong password and wants the refusal).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rocx
          POSTGRES_PASSWORD: rocx
          POSTGRES_DB: rocx
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rocx" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://rocx:rocx@127.0.0.1:55432/rocx
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: .github/watch.sh just test-server

  examples:
    name: just examples
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: .github/watch.sh just examples
