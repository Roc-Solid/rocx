# The checks a change lands with (README, "Quick start"), on GitHub's macOS runners (Apple silicon):
# the one machine the Roc fork's compiler is prebuilt for (`just setup` downloads it). Each its own
# job, side by side: `just check` (then `just check-times`: how long checking takes, against the
# last green master run), `just test` as two (`test-rocx` and `test-web`, with Chromium and Firefox;
# `test-server`, with a Postgres too), `just examples` and `just site`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A pull request's newer push stops its older run; master's runs all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # The runners are slower than the machines the tests' time limits are measured on (a VM, its
  # Roc caches cold): the tests that measure time (site/test's dev rebuild, web/test/navigation's
  # waits and hover rest, server/test's 2,000 waits) allow that much more.
  ROCX_TIME_SCALE: "3"

jobs:
  check:
    name: just check
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # the last green master run's check times
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      # How long checking each example and the site takes, in the job's summary, against the last
      # green master run's (its artifact, which carries the master runs before it): a warning, not a
      # failure, when one got slower.
      - name: just check-times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow ci.yml --branch master --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ]; then gh run download "$last" --name check-times --dir "$RUNNER_TEMP/baseline" || true; fi
          just check-times --baseline "$RUNNER_TEMP/baseline/check-times.json" --out check-times.json
      - uses: actions/upload-artifact@v7
        with:
          name: check-times
          path: check-times.json
          retention-days: 90

  # `just test` in two jobs side by side: its first two parts (the transpiler, the expects, the web
  # platform and the site in browsers), each a step that runs even when the one before failed, and
  # its third (the server platform and the packages' apps, on a Postgres).
  test:
    name: just test-rocx, test-web
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: just test-rocx
      - if: ${{ !cancelled() }}
        run: just test-web

  test-server:
    name: just test-server
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          postgres: "true"
      - run: just test-server

  examples:
    name: just examples
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: just examples

  site:
    name: just site
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just site
