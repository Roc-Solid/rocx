# The checks a change lands with (README, "Quick start"), on GitHub's macOS runners (Apple silicon):
# the one machine the Roc fork's compiler is prebuilt for (`just setup` downloads it). Four jobs,
# side by side: `just check` (then `just check-times`: how long checking takes, against the last
# green master run) and `just site`; `just test` as two (`test-rocx` and `test-web`, with Chromium
# and Firefox; `test-server`, with a Postgres too); and `just examples`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A pull request's newer push stops its older run; master's runs all finish. Pull requests are
# grouped by number: a push to one just merged reports master's ref, and it took the place of
# master's own run waiting for a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # The runners are slower than the machines the tests' time limits are measured on (a VM, its
  # Roc caches cold): the tests that measure time (site/test's dev rebuild, web/test/navigation's
  # waits and hover rest, web/test/platform's channel reconnects, server/test's 2,000 waits) allow
  # that much more.
  ROCX_TIME_SCALE: "3"

jobs:
  # `just check` and `just site` in one job (5 and 9 minutes; still shorter than the tests'), so a
  # run asks for four macOS runners, not the five a free organization may have at once (GitHub has
  # left a fifth job unstarted for want of macOS capacity).
  check:
    name: just check, just site
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # the last green master run's check times
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just check
      # How long checking each example and the site takes, in the job's summary, against the last
      # green master run's (its artifact, which carries the master runs before it): a warning, not a
      # failure, when one got slower.
      - name: just check-times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow ci.yml --branch master --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$last" ]; then gh run download "$last" --name check-times --dir "$RUNNER_TEMP/baseline" || true; fi
          just check-times --baseline "$RUNNER_TEMP/baseline/check-times.json" --out check-times.json
      - uses: actions/upload-artifact@v7
        with:
          name: check-times
          path: check-times.json
          retention-days: 90
      - if: ${{ !cancelled() }}
        run: just site

  # `just test` in two jobs side by side: its first two parts (the transpiler, the expects, the web
  # platform and the site in browsers), each a step that runs even when the one before failed, and
  # its third (the server platform and the packages' apps, on a Postgres).
  test:
    name: just test-rocx, test-web
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: just test-rocx
      - if: ${{ !cancelled() }}
        run: just test-web

  test-server:
    name: just test-server
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
          postgres: "true"
      - run: just test-server

  examples:
    name: just examples
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: just examples
